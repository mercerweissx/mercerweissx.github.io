<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/main.css">
  <link type="application/atom+xml" rel="alternate" href="http://www.mercerweissx.com/feed.xml" title="mercerweissx">

  <style id="highlight-mengshou-style">

    @font-face {
      font-family: custom-font;
      size-adjust: 125%;
      src: url("/assets/antique-regular.ttf");
    }

    @font-face {
      font-family: custom-font;
      font-style: italic;
      size-adjust: 125%;
      src: url("/assets/antique-italic.ttf");
    }

    @font-face {
      font-family: custom-font;
      font-style: oblique;
      size-adjust: 125%;
      src: url("/assets/antique-italic.ttf");
    }
    
    body {
      background-image: url("/assets/background.jpg");
      font-family: custom-font;
    }
    
    a:link,
    a:visited,
    a:hover,
    a:focus,
    a:active {
      color: black;
      font-weight: bold;
    }
  
    hr {
      border-top: solid 2px black;
      border-bottom: none;
      border-right: none;
      border-left: none;
    }

    a.header-button {
      text-decoration: none !important;
      border: 0 !important;
    }

    a.header-button img {
      height: 24px;
      width: 24px;
      padding-bottom: 3px;
      padding-right: 10px;
    }
    
    .highlight-mengshou-wrap {
      cursor: pointer;
    }
    
    .highlight-mengshou-wrap.active {

    }

    .headshot {
      text-align: centered;
      width: 20vw;
      height: auto;
      margin: 25px auto;
      border: 10px double black;
    }

    .headshot img {
      width: 100%;
      height: auto;
    }

    .site-header {
      background-color: black;
      border: none;
    }

    .site-title, 
    .site-title:visited, 
    .site-header a:link,
    .site-header a:visited,
    .site-header a:hover,
    .site-header a:focus,
    .site-header a:active {
      color: #eee;
    }

    .site-footer {
      background-color: black;
      color: #eee;
      border: none;
    }
